[package]
name = "phantom-runtime"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
phantom-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
glam = { version = "0.30", features = ["serde"] }
bevy = { version = "0.17.3", default-features = false, features = [
    "bevy_asset",
    "bevy_log",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_pbr",
    "bevy_image",
    "png",
    "std",
    "async_executor",
] }
# tiff is available from the offline cache; webp/exr need new crates (see docs/architecture.md).
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff"] }
thiserror = "2"
ufbx = "0.4"
cpal = "0.17"
